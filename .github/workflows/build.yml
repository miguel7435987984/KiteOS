name: KiteOS 2.0 CI & Build Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Alvo de Compilação do KiteOS'
        required: true
        default: 'rom-image'
        type: choice
        options:
          - 'rom-image'
          - 'assets-only'
          - 'full-pipeline'

jobs:
  verify-and-package:
    name: 🪁 Verificar e Empacotar Artefatos KiteOS 2.0
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório KiteOS
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip imagemagick libxml2-utils

      - name: 🔍 Validar Bootanimation (desc.txt e compressão 0)
        run: |
          echo "Verificando integridade da bootanimation oficial do KiteOS..."
          if [ -f bootanimation/bootanimation.zip ]; then
            # Testar se a compressão é do tipo STORED (0%)
            unzip -v bootanimation/bootanimation.zip | head -n 20
            # Extrair desc.txt e validar dimensões
            unzip -p bootanimation/bootanimation.zip desc.txt > /tmp/desc.txt
            cat /tmp/desc.txt
            if grep -q "1080 1920" /tmp/desc.txt; then
              echo "✅ Resolução 1080x1920 confirmada!"
            else
              echo "❌ Resolução incorreta no desc.txt"
              exit 1
            fi
          else
            echo "⚠️ bootanimation.zip não encontrado na pasta bootanimation/"
          fi

      - name: 🎨 Validar Papéis de Parede e Banner
        run: |
          echo "Verificando dimensões dos assets visuais do KiteOS..."
          identify wallpapers/kiteos_default_wallpaper.png || true
          identify assets/kiteos_settings_banner.png || true

      - name: 📦 Gerar Pacote de Customização KiteOS 2.0
        run: |
          mkdir -p dist
          cp -v bootanimation/bootanimation.zip dist/KiteOS-2.0-Bootanimation.zip || true
          cp -v wallpapers/kiteos_default_wallpaper.png dist/KiteOS-2.0-Wallpaper.png || true
          cp -v assets/kiteos_settings_banner.png dist/KiteOS-2.0-Settings-Banner.png || true

          # Criar ZIP com tudo reunido
          cd dist
          zip -9 KiteOS-2.0-Customization-Bundle.zip *.png *.zip || true
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: 🚀 Publicar Artefatos Visuais no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: KiteOS-2.0-Official-Assets
          path: dist/
          retention-days: 14

  package-rom-image:
    name: 💿 Gerar e Publicar Imagem KiteOS 2.0 (.img)
    needs: verify-and-package
    if: "${{ github.event.inputs.build_target != 'assets-only' }}"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório KiteOS
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Baixar Imagem Base Android 14 (AOSP x86_64)
        run: |
          echo "Configurando Android SDK..."
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            echo "Configurando cmdline-tools em fallback local..."
            mkdir -p $HOME/android-sdk/cmdline-tools
            curl -sS -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
            mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
          fi

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "y" | sdkmanager --licenses > /dev/null 2>&1 || true

          echo "🚀 Baixando imagem de sistema Android 14 (API 34 x86_64)..."
          sdkmanager "system-images;android-34;default;x86_64"

          echo "LOCAL_SYS_DIR=$(find $ANDROID_SDK_ROOT/system-images/android-34/default/x86_64 -name system.img -exec dirname {} \;)" >> $GITHUB_ENV

      - name: 🪁 Montar e Customizar Pacote da ROM KiteOS 2.0
        run: |
          IMG_SRC="${{ env.LOCAL_SYS_DIR }}"
          echo "Origem da imagem Android 14: $IMG_SRC"
          ls -lh "$IMG_SRC"

          DIST_DIR="$GITHUB_WORKSPACE/kiteos-release"
          mkdir -p "$DIST_DIR"

          echo "📋 Copiando partições da ROM (system.img, vendor.img, ramdisk.img)..."
          cp -v "$IMG_SRC/system.img" "$DIST_DIR/"
          cp -v "$IMG_SRC/vendor.img" "$DIST_DIR/"
          cp -v "$IMG_SRC/ramdisk.img" "$DIST_DIR/"
          cp -v "$IMG_SRC/kernel-ranchu" "$DIST_DIR/"
          cp -v "$IMG_SRC/advancedFeatures.ini" "$DIST_DIR/"
          cp -v "$IMG_SRC/source.properties" "$DIST_DIR/"

          echo "⚙️ Injetando propriedades de identidade do KiteOS 2.0 no build.prop..."
          cp "$IMG_SRC/build.prop" "$DIST_DIR/build.prop"
          cat << 'EOF' >> "$DIST_DIR/build.prop"

          # ==========================================
          # Identidade Oficial KiteOS 2.0
          # ==========================================
          ro.kite.version=2.0
          ro.kite.developer=Miguel
          ro.kite.motto=Fast • Lightweight • Free
          ro.kite.codename=prism
          ro.build.display.id=KiteOS-2.0-UDC-Miguel
          EOF

          echo "🎨 Anexando assets oficiais e scripts do KiteOS..."
          mkdir -p "$DIST_DIR/kiteos-assets"
          cp -v bootanimation/bootanimation.zip "$DIST_DIR/kiteos-assets/" 2>/dev/null || true
          cp -v wallpapers/kiteos_default_wallpaper.png "$DIST_DIR/kiteos-assets/" 2>/dev/null || true
          cp -v assets/kiteos_settings_banner.png "$DIST_DIR/kiteos-assets/" 2>/dev/null || true
          if [ -d scripts ]; then
            cp -rv scripts "$DIST_DIR/"
          fi

          echo "📦 Baixando e integrando pacote GApps oficial (Play Store e Services)..."
          mkdir -p "$DIST_DIR/gapps"
          curl -L -sS -o /tmp/mtg.zip "https://github.com/MustardChef/MindTheGapps-14.0.0-x86_64/releases/download/MindTheGapps-14.0.0-x86_64-20250202_012724/MindTheGapps-14.0.0-x86_64-20250202_012724.zip"
          unzip -q /tmp/mtg.zip -d /tmp/mtg_unzip
          cp -v /tmp/mtg_unzip/system/system_ext/priv-app/GoogleServicesFramework/GoogleServicesFramework.apk "$DIST_DIR/gapps/"
          cp -v /tmp/mtg_unzip/system/product/priv-app/GmsCore/GmsCore.apk "$DIST_DIR/gapps/"
          cp -v /tmp/mtg_unzip/system/product/priv-app/Phonesky/Phonesky.apk "$DIST_DIR/gapps/"
          cp -v /tmp/mtg_unzip/system/product/app/GoogleContactsSyncAdapter/GoogleContactsSyncAdapter.apk "$DIST_DIR/gapps/"
          cp -v /tmp/mtg_unzip/system/product/app/GoogleCalendarSyncAdapter/GoogleCalendarSyncAdapter.apk "$DIST_DIR/gapps/"
          cp -v /tmp/mtg_unzip/system/product/priv-app/GooglePartnerSetup/GooglePartnerSetup.apk "$DIST_DIR/gapps/"
          rm -rf /tmp/mtg.zip /tmp/mtg_unzip

          echo "📜 Criando script de execução rápida do KiteOS..."
          cat << 'EOF' > "$DIST_DIR/run-kiteos.sh"
          #!/usr/bin/env bash
          set -e
          echo "======================================================"
          echo "🪁 KiteOS 2.0 (Android 14 - x86_64)"
          echo "Desenvolvedor: Miguel | Motto: Fast • Lightweight • Free"
          echo "======================================================"
          if ! command -v emulator &> /dev/null; then
              echo "❌ Android Emulator não encontrado no PATH."
              echo "Instale o Android SDK ou execute via Android Studio."
              exit 1
          fi
          emulator -sysdir . -system system.img -vendor vendor.img -ramdisk ramdisk.img -kernel kernel-ranchu -writable-system "$@"
          EOF
          chmod +x "$DIST_DIR/run-kiteos.sh"

          cat << 'EOF' > "$DIST_DIR/README.md"
          # 🪁 KiteOS 2.0 (Android 14) - Imagem do Sistema (.img)

          - **Versão:** 2.0 (UpsideDownCake / Android 14)
          - **Arquitetura:** x86_64
          - **Desenvolvedor:** Miguel
          - **Motto:** Fast • Lightweight • Free
          - **Identidade:** Prisma 3D, Bootanimation 60FPS 1080x1920, Wallpaper Ultra HD
          - **GApps:** Google Play Store, Google Play Services e GSF inclusos

          ## 🚀 Como Executar
          ```bash
          chmod +x run-kiteos.sh
          ./run-kiteos.sh
          ```

          ## 📲 Como Ativar o GApps
          Com o emulador rodando, execute:
          ```bash
          chmod +x scripts/install-gapps.sh
          ./scripts/install-gapps.sh
          ```
          EOF

      - name: 🗜️ Comprimir Imagem da ROM (.zip com compressão máxima)
        run: |
          cd "$GITHUB_WORKSPACE/kiteos-release"
          echo "Compactando distribuição da ROM KiteOS 2.0..."
          zip -r -9 "$GITHUB_WORKSPACE/KiteOS-2.0-Android14-x86_64-ROM.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum KiteOS-2.0-Android14-x86_64-ROM.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh KiteOS-2.0-Android14-x86_64-ROM.zip

      - name: 🚀 Publicar Imagem .img e ROM no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: KiteOS-2.0-Android14-x86_64-ROM-Image
          path: |
            KiteOS-2.0-Android14-x86_64-ROM.zip
            SHA256SUMS.txt
          retention-days: 14
